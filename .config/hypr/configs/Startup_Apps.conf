# Commands and Apps to be executed at launch (vendor defaults)
$scriptsDir = $HOME/.config/hypr/scripts
$UserScripts = $HOME/.config/hypr/UserScripts
$lock = $scriptsDir/LockScreen.sh
$SwwwRandom = $UserScripts/WallpaperAutoChange.sh
$livewallpaper=""
$wallDIR = $HOME/Pictures/wallpapers  # change path manually here if needed

### wallpaper stuff ###
exec-once = $scriptsDir/WallpaperDaemon.sh
#exec-once = mpvpaper '*' -o "load-scripts=no no-audio --loop" $livewallpaper
# wallpaper random
#exec-once = $SwwwRandom $wallDIR # random wallpaper switcher every 30 minutes

### Startup ###
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = $HOME/.config/hypr/scripts/Dropterminal.sh "kitty --class kitty-dropterm" &
exec-once = $scriptsDir/Polkit.sh
exec-once = nm-applet --indicator
#exec-once = nm-tray   # For ubuntu -- redundant with nm-applet above, was launching a second network tray icon (2026-08-15 perf audit)
exec-once = swaync
#exec-once = ags
#exec-once = blueman-applet
#exec-once = rog-control-center
exec-once = $scriptsDir/PortalHyprlandUbuntu.sh
exec-once = waybar
exec-once = qs -c overview  # Quickshell Overview
exec-once = hypridle
exec-once = $scriptsDir/Hyprsunset.sh init

# Clipboard manager
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Rainbow borders (disabled by default; use quick settings menu)
#exec-once = $UserScripts/RainbowBorders.sh


# Here are list of features available but disabled by default
# Persistent wallpaper
# exec-once = sh -c '$HOME/.config/hypr/scripts/WallpaperDaemon.sh && (command -v awww >/dev/null 2>&1 && awww img "$wallDIR/mecha-nostalgia.png" || swww img "$wallDIR/mecha-nostalgia.png")'

# Gnome polkit for NixOS
#exec-once = $scriptsDir/Polkit-NixOS.sh

# xdg-desktop-portal-hyprland (should be auto starting. However, you can force to start)
#exec-once = $scriptsDir/PortalHyprland.sh
exec-once = blueman-applet
# duplicate `qs -c overview` removed here (2026-08-15 perf audit) -- already launched once above at line 34
exec-once = $scriptsDir/KeybindsLayoutInit.sh

# ProtonVPN: launch moved solely to UserConfigs/Startup_Apps.conf's pgrep-guarded
# version (2026-08-15 perf audit). This unconditional launch had no pgrep check
# and raced that guarded fallback on every boot -- flatpak startup takes longer
# than the guard's near-instant check, so both could fire and launch two
# competing single-instance ProtonVPN processes. Hypothesis for the previously
# undiagnosed "ProtonVPN stuck running but invisible" bug in memory, not yet
# confirmed live. Re-enable if ProtonVPN stops autostarting under Hyprland and
# the guarded copy turns out not to fire reliably on its own.
#exec-once = sleep 4 && /usr/bin/flatpak run --branch=stable --arch=x86_64 --command=protonvpn-app --file-forwarding com.protonvpn.www
