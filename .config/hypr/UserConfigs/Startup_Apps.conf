# Commands and Apps to be executed at launch

# Workaround: plasmalogin's last frame (clock/login box) stays on screen after
# handoff to Hyprland until something forces a repaint. Force one via DPMS toggle.
# Bumped sleep 2 -> 5 (2026-08-09): waybar's bottom-bar layer surface was getting
# created while dpms was off, so it never got a valid configure/map and never
# showed after reboot (top bar, created just before dpms off, was unaffected).
# Confirmed via hyprland.log line-level ordering. 5s gives waybar's exec-once
# (fired at Hyprland startup) room to create+map both bars before the toggle fires.
exec-once = sleep 5 && hyprctl dispatch dpms off && sleep 0.5 && hyprctl dispatch dpms on

# Trigger the KWallet unlock dialog; blocks until the user logs in.
# Apps below that need the wallet wait on this via wait-kwallet.sh.
exec-once = dbus-send --session --print-reply --dest=org.kde.kwalletd6 /modules/kwalletd6 org.kde.KWallet.open string:"kdewallet" int64:0 string:"autostart"

# cachy-update --tray: originally relied solely on ~/.config/autostart/arch-update-tray.desktop
# (XDG autostart) instead of exec-once here, to avoid the double-launch collision
# confirmed in the journal (2026-07-26). Re-added as a guarded fallback (2026-08-09)
# after finding xdg-desktop-autostart.target itself can fail to activate for an
# entire session (confirmed inactive/dead on a pure-Hyprland boot with no COSMIC
# involved), leaving the tray icon missing with nothing to fall back on. `pgrep -x`
# can't be used here: the process comm truncates to "arch-update-tra" (15-char
# kernel limit), so match on the full binary path instead. `-A`/--ignore-ancestors
# is required: Hyprland runs this whole line via `sh -c "<line>"`, so without -A
# `pgrep -f` matches its own invoking sh -c ancestor (its argv contains this same
# path as literal text) and permanently reports "already running", so the
# fallback launch never fires (confirmed root cause, 2026-08-09).
#
# 2026-08-09 (later same day): even with -A, the tray icon was still missing
# every cold boot. Confirmed via `busctl --user list` that no
# org.kde.StatusNotifierItem for arch-update-tray exists post-boot, with zero
# trace in journalctl/dmesg (no crash, no OOM, no error) - the binary just
# exits silently. Root cause: this line has no delay and fires right after
# waybar's own exec-once, but waybar needs a moment to init and register its
# org.kde.StatusNotifierWatcher on the session bus. The compiled
# arch-update-tray binary doesn't wait/retry for that watcher - confirmed live
# that it also exits if the watcher disappears out from under an
# already-running instance (briefly killing waybar mid-session killed it too).
# Once launched after the watcher is already up it stays running fine. Also
# found (not yet cleaned up, needs sudo): a dangling
# /etc/systemd/user/graphical-session.target.wants/arch-update-tray.service
# symlink pointing at a unit file that no longer exists in the current
# cachy-update package - inert (systemd skips missing want-symlinks) but stale.
#
# 2026-08-10: a fixed `sleep 3` fix here was only ever confirmed stable across
# one boot and lost the race again on this boot (tray absent from
# `busctl --user list`, arch-update-tray not running, no crash/coredump) with
# no config change in between - boot-time timing varies, so any fixed sleep is
# just a smaller window, not a fix. Replaced with wait-for-sni-watcher.sh,
# which polls the actual org.kde.StatusNotifierWatcher dbus condition (same
# pattern as wait-kwallet.sh below) instead of guessing a delay.
exec-once = ~/.config/hypr/scripts/wait-for-sni-watcher.sh sh -c 'pgrep -A -u "$UID" -f /usr/lib/arch-update/arch-update-tray >/dev/null || arch-update --tray'
#
# ProtonVPN and Proton Mail Bridge also have their own XDG autostart entries
# (~/.config/autostart/com.protonvpn.www.desktop, proton-bridge.desktop / "Proton
# Mail Bridge.desktop"), same as Koofr. That entry only fires once per login: if
# the session starts in COSMIC and later switches to Hyprland, COSMIC's session
# teardown stops these apps (confirmed via journalctl, 2026-08-04 — Koofr,
# ProtonVPN, and Proton Mail Bridge all stopped together) and they never restart
# under Hyprland. Guarded so this exec-once is a no-op if the XDG autostart copy
# is already running, and a fallback launch if it isn't.
exec-once = pgrep -u "$UID" -x protonvpn-app >/dev/null || flatpak run com.protonvpn.www --start-minimized

exec-once = ~/.config/hypr/scripts/wait-kwallet.sh signal-desktop --password-store="kwallet6"
# -A required: same self-matching-ancestor bug as arch-update-tray above.
exec-once = pgrep -A -u "$UID" -f /usr/bin/protonmail-bridge >/dev/null || ~/.config/hypr/scripts/wait-kwallet.sh protonmail-bridge

# Koofr also has an XDG autostart entry (~/.config/autostart/koofr.desktop) that
# normally covers it, but that entry only fires once per login: if the session
# starts in COSMIC and later switches to Hyprland, COSMIC's session teardown
# stops Koofr and it never restarts under Hyprland (confirmed via journalctl,
# 2026-08-04). Guard against double-launch when already running from XDG autostart.
exec-once = pgrep -u "$UID" -x storagegui >/dev/null || ~/.koofr-dist/storagegui -silent

# Joplin: same COSMIC-teardown gap as Koofr (only had
# ~/.config/autostart/joplin-app-desktop.desktop, no Hyprland exec-once —
# confirmed stopped at 08:22:21 today alongside Koofr/VPN/bridge and never
# auto-restarted under Hyprland). Electron's comm truncates to "electron" for
# every Electron app (Joplin, Signal, ...), so the guard matches on the asar
# path instead of process name to avoid false-positiving on other Electron apps.
# -A required: same self-matching-ancestor bug as arch-update-tray above.
exec-once = pgrep -A -u "$UID" -f 'joplin-desktop/app.asar' >/dev/null || ~/.config/hypr/scripts/wait-kwallet.sh joplin-desktop --password-store=kwallet6


