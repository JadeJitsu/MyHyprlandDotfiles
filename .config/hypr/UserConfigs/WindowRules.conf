# For window rules and layerrules
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# This file is used to add or overwrite window rules 
# This file will not be modified during dotfiles updates


# no_blur on kitty removed 2026-08-09 to enable background blur
# windowrule = no_blur on, match:class ^kitty$

# KWallet unlock dialog spawns early at startup; without these it slides off-screen
# due to the windowsIn slide animation starting from an edge before workspace is ready.
windowrule = float on, match:class ^kwalletd6$
windowrule = center 1, match:class ^kwalletd6$

#  Optional Layer rules
#  To Resolve blurred corners in rofi  Uncomment
# layerrule = blur on, ignore_alpha 0, match:namespace rofi


