# User Settings
# This is where you put your own settings as this will not be touched during update 
# if the upgrade.sh is used.

# refer to Hyprland wiki for more info https://wiki.hyprland.org/Configuring/Variables/
# NOTE: some settings are in ~/.config/hypr/UserConfigs/UserDecorAnimations.conf
#
# Look on ~/.config/hypr/configs/SystemSettings.conf to know how to modify this

# TEMP (2026-08-09): debugging bottom waybar bar missing its layer-shell
# surface after cold boot (top bar always renders, bottom sometimes doesn't;
# manual `waybar &` relaunch always fixes it instantly). disable_logs=1 is
# Hyprland's factory default and there's no override anywhere else in this
# config, so exec-once/layer-surface events for the boot are never captured.
# Revert this once root-caused: remove this block, or flip back to `true`.
debug {
    disable_logs = false
}

